name: Bouw iPhone-app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Projectmap zoeken
        run: |
          FILE=$(find . -name project.yml -not -path './.git/*' | head -1)
          if [ -z "$FILE" ]; then echo "project.yml niet gevonden in de repo"; exit 1; fi
          DIR=$(dirname "$FILE")
          echo "APPDIR=$DIR" >> "$GITHUB_ENV"
          echo "Projectmap: $DIR"; ls -la "$DIR"
          cd "$DIR"
          # Losse bestanden geupload (zonder mapjes)? Dan zetten we ze hier zelf in de juiste mappen.
          mkdir -p Sources
          for f in *.swift; do [ -e "$f" ] && mv "$f" Sources/; done
          if [ -f icon-1024.png ]; then
            mkdir -p Sources/Assets.xcassets/AppIcon.appiconset
            mv icon-1024.png Sources/Assets.xcassets/AppIcon.appiconset/
            echo '{ "info" : { "author" : "xcode", "version" : 1 } }' > Sources/Assets.xcassets/Contents.json
            echo '{ "images" : [ { "filename" : "icon-1024.png", "idiom" : "universal", "platform" : "ios", "size" : "1024x1024" } ], "info" : { "author" : "xcode", "version" : 1 } }' > Sources/Assets.xcassets/AppIcon.appiconset/Contents.json
          fi
          echo "Gevonden Swift-bestanden:"; ls Sources
          if ! ls Sources/*.swift >/dev/null 2>&1; then echo "Geen .swift-bestanden gevonden. Upload de .swift-bestanden opnieuw."; exit 1; fi

      - name: XcodeGen installeren
        run: brew install xcodegen

      - name: Xcode-project maken
        run: cd "$APPDIR" && xcodegen generate

      - name: App bouwen (zonder ondertekening, dat doet Signulous)
        run: |
          cd "$APPDIR"
          xcodebuild \
            -project Bankjesvinder.xcodeproj \
            -scheme Bankjesvinder \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: IPA-bestand maken
        run: |
          mkdir -p Payload
          cp -R "$APPDIR/build/Build/Products/Release-iphoneos/Bankjesvinder.app" Payload/
          zip -qry Bankjesvinder.ipa Payload

      - name: IPA klaarzetten om te downloaden
        uses: actions/upload-artifact@v4
        with:
          name: Bankjesvinder-ipa
          path: Bankjesvinder.ipa
