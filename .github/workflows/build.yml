name: Bouw iPhone-app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Projectmap zoeken
        run: |
          FILE=$(find . -name project.yml -not -path './.git/*' | head -1)
          if [ -z "$FILE" ]; then echo "project.yml niet gevonden in de repo"; exit 1; fi
          DIR=$(dirname "$FILE")
          echo "APPDIR=$DIR" >> "$GITHUB_ENV"
          echo "Projectmap: $DIR"; ls -la "$DIR"
          if [ ! -d "$DIR/Sources" ]; then echo "De map Sources ontbreekt naast project.yml. Upload de map Sources opnieuw."; exit 1; fi

      - name: XcodeGen installeren
        run: brew install xcodegen

      - name: Xcode-project maken
        run: cd "$APPDIR" && xcodegen generate

      - name: App bouwen (zonder ondertekening, dat doet Signulous)
        run: |
          cd "$APPDIR"
          xcodebuild \
            -project Bankjesvinder.xcodeproj \
            -scheme Bankjesvinder \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: IPA-bestand maken
        run: |
          mkdir -p Payload
          cp -R "$APPDIR/build/Build/Products/Release-iphoneos/Bankjesvinder.app" Payload/
          zip -qry Bankjesvinder.ipa Payload

      - name: IPA klaarzetten om te downloaden
        uses: actions/upload-artifact@v4
        with:
          name: Bankjesvinder-ipa
          path: Bankjesvinder.ipa
