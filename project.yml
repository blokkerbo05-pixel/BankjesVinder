name: Bankjesvinder
options:
  bundleIdPrefix: nl.bo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Bankjesvinder:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - ".git/**"
          - ".github/**"
          - "build/**"
          - "Payload/**"
          - "Bankjesvinder.xcodeproj/**"
          - "*.yml"
          - "*.md"
          - "*.json"
          - "*.png"
          - "*.ipa"
          - "Info.plist"
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.bo.bankjesvinder
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Bankjes
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSLocationWhenInUseUsageDescription: "Bankjesvinder gebruikt je locatie om de bankjes bij jou in de buurt te laten zien."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
